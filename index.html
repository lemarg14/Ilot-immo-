<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Îlot Immobilier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout : un territoire 3D plein écran (le "plateau de jeu"), entouré de HUD en verre — barre du haut, filtres à gauche, fiche du bien à droite, vitrine des biens en bas. */
:root{
  --ink:#121833; --muted:#5A6386; --paper:#EEF2F9; --glass:rgba(255,255,255,.84); --glass-2:rgba(255,255,255,.62);
  --line:rgba(18,24,51,.10); --cobalt:#2B44FF; --cobalt-soft:rgba(43,68,255,.12); --ok:#1E9E62;
  --z-ville:#6E7FB0; --z-peri:#D99A3D; --z-campagne:#6E9F55; --z-littoral:#2F9CC4;
  --f-display:"Syne","Avenir Next","Segoe UI",sans-serif; --f-body:"Manrope","Segoe UI",system-ui,sans-serif; --f-data:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px -12px rgba(18,24,51,.28),0 2px 6px -2px rgba(18,24,51,.10);
  color-scheme:light;
}
body.night{
  --ink:#EEF1FF; --muted:#9BA4CC; --paper:#0A0E22; --glass:rgba(17,22,48,.82); --glass-2:rgba(17,22,48,.6);
  --line:rgba(255,255,255,.12); --cobalt:#6F84FF; --cobalt-soft:rgba(111,132,255,.18);
  --shadow:0 10px 30px -10px rgba(0,0,0,.6);
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;transition:background .8s}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing} #gl.hot{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transition:background .8s,border-color .8s}

/* ---------- top bar ---------- */
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.zones{display:flex;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.zones::-webkit-scrollbar{display:none}
.zones button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:7px;color:var(--muted);transition:.2s}
.zones button i{width:8px;height:8px;border-radius:3px;background:var(--c,var(--ink))}
.zones button:hover{color:var(--ink);background:var(--cobalt-soft)}
.zones button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.spacer{flex:1}
.tools{display:flex;gap:6px;padding:4px}
.tools button{border:0;background:none;height:34px;padding:0 12px;border-radius:10px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.tools button:hover{background:var(--cobalt-soft)}
.tools button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
.tools svg{width:16px;height:16px}

/* ---------- filters ---------- */
.filters{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 76px);width:244px;padding:14px;display:grid;gap:14px;z-index:4}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{display:block;font-family:var(--f-data);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:11px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cobalt-soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.range-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.range-row b{font-family:var(--f-data);font-size:13px}
input[type=range]{width:100%;accent-color:var(--cobalt)}
.filters .count{font-size:12px;color:var(--muted)}
.filters .count b{color:var(--ink)}
.fold{border:0;background:none;padding:0;display:none;font-weight:700;font-size:12px;align-items:center;gap:6px}

/* ---------- pins & labels ---------- */
#labels{position:absolute;inset:0;pointer-events:none;z-index:2}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:0;background:none;transform-origin:50% 100%;transition:opacity .35s,filter .35s}
.pin .chip{display:flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border-radius:999px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--f-data);font-weight:600;font-size:12px;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .25s,color .25s}
.pin .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--zc);color:#fff}
.pin .dot svg{width:11px;height:11px}
.pin .stalk{width:2px;height:22px;margin:0 auto;background:linear-gradient(var(--zc),transparent)}
.pin:hover .chip,.pin.hover .chip{transform:translateY(-4px) scale(1.08)}
.pin.active .chip{background:var(--cobalt);color:#fff;transform:translateY(-6px) scale(1.15)}
.pin.active .dot{background:#fff;color:var(--cobalt)}
.pin.off{opacity:0;pointer-events:none}
.zlabel{position:absolute;left:0;top:0;font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.4vw,30px);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.22;white-space:nowrap;transition:opacity .5s}
.zlabel small{display:block;font-family:var(--f-data);font-size:11px;letter-spacing:.04em;font-weight:500;text-transform:none;opacity:.9}

/* ---------- detail panel ---------- */
.panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 76px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:380px;display:flex;flex-direction:column;z-index:6;transform:translateX(0);transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .4s,background .8s}
.panel.closed{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
.panel-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.panel-head .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--zc)}
.tag i{width:8px;height:8px;border-radius:3px;background:var(--zc)}
.x{border:0;background:var(--cobalt-soft);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
.panel .town{color:var(--muted);font-size:13px}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price b{font-family:var(--f-data);font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.price span{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.panel-body{overflow-y:auto;padding:14px 16px 16px;display:grid;gap:16px;align-content:start;flex:1;min-height:0}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.spec{background:var(--cobalt-soft);border-radius:10px;padding:8px 6px;text-align:center}
.spec b{display:block;font-family:var(--f-data);font-size:14px;font-variant-numeric:tabular-nums}
.spec span{font-size:10.5px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--glass-2);border-radius:11px;padding:10px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn:hover{border-color:var(--cobalt);color:var(--cobalt)}
.btn[aria-pressed="true"]{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);grid-column:1/-1}
.btn.primary:hover{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.btn svg{width:16px;height:16px}
.desc{line-height:1.6;color:var(--ink);margin:0;max-width:65ch}
.hl{display:flex;flex-wrap:wrap;gap:6px}
.hl span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.plan{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--glass-2)}
.plan svg{width:100%;height:auto;display:block}
.plan .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.dpe{display:grid;gap:3px}
.dpe .bar{display:flex;align-items:center;gap:8px;height:20px}
.dpe .bar i{height:100%;border-radius:0 6px 6px 0;display:flex;align-items:center;padding-left:7px;font-style:normal;font-weight:800;font-size:11px;color:#1b1b1b;opacity:.38;transition:.3s}
.dpe .bar.on i{opacity:1;height:24px;box-shadow:0 0 0 2px var(--ink)}
.dpe .bar em{font-style:normal;font-family:var(--f-data);font-size:11.5px;font-weight:600}
.sim{display:grid;gap:10px}
.sim label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.sim .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sim select,.sim input[type=number]{font:inherit;font-family:var(--f-data);color:var(--ink);background:var(--glass-2);border:1px solid var(--line);border-radius:9px;padding:7px 8px;width:100%}
.out{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out div{border-radius:10px;padding:9px 10px;background:var(--cobalt-soft)}
.out div:first-child{background:var(--ink);color:var(--paper);grid-column:1/-1}
.out b{display:block;font-family:var(--f-data);font-size:17px;font-variant-numeric:tabular-nums}
.out div:first-child b{font-size:24px}
.out span{font-size:11px;opacity:.75}
.note{font-size:11px;color:var(--muted);margin:0}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.slots .d{font-size:10.5px;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase}
.slots button{border:1px solid var(--line);background:var(--glass-2);border-radius:8px;padding:6px 0;font-family:var(--f-data);font-size:11.5px}
.slots button:hover{border-color:var(--cobalt)}
.slots button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.confirm{font-size:12.5px;background:rgba(30,158,98,.12);color:var(--ok);border-radius:10px;padding:9px 11px;font-weight:600}
.sec-t{font-family:var(--f-display);font-weight:700;font-size:14px;margin:0 0 8px;letter-spacing:-.01em}

/* ---------- strip ---------- */
.strip{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px;overflow-x:auto;padding:6px 2px 4px;z-index:3;scrollbar-width:thin;transition:right .55s cubic-bezier(.2,.9,.2,1)}
body.panel-open .strip{right:calc(max(16px,env(safe-area-inset-right,0px)) + 396px)}
.card{flex:none;width:214px;text-align:left;padding:10px 12px;display:grid;gap:4px;border-radius:13px;transition:transform .25s,border-color .25s,opacity .3s}
.card:hover{transform:translateY(-3px);border-color:var(--cobalt)}
.card.active{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt),var(--shadow)}
.card .tag{font-size:10px}
.card b{font-family:var(--f-display);font-weight:700;font-size:14.5px;line-height:1.15;letter-spacing:-.01em}
.card .meta{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:12px;color:var(--muted)}
.card .meta strong{color:var(--ink);font-weight:600}

/* ---------- camera controls ---------- */
.cam{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);display:grid;gap:2px;padding:4px;z-index:3;transition:right .55s cubic-bezier(.2,.9,.2,1)}
body.panel-open .cam{right:calc(max(16px,env(safe-area-inset-right,0px)) + 396px)}
.cam button{width:34px;height:34px;border:0;background:none;border-radius:9px;display:grid;place-items:center}
.cam button:hover{background:var(--cobalt-soft)}
.cam svg{width:16px;height:16px}
.hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);font-size:12px;color:var(--muted);padding:6px 12px;border-radius:999px;z-index:2;white-space:nowrap;transition:opacity .6s}
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);transform:translate(-50%,20px);opacity:0;padding:9px 14px;font-weight:600;font-size:13px;z-index:8;transition:.4s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 108px);font-size:10.5px;color:var(--muted);z-index:2}

/* ---------- intro ---------- */
#intro{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:var(--paper);transition:opacity .9s ease,visibility .9s;cursor:pointer}
#intro.gone{opacity:0;visibility:hidden}
#intro .in{text-align:center;padding:0 24px}
#intro h1{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,14vw,170px);letter-spacing:-.05em;line-height:.85;margin:0;display:flex;justify-content:center}
#intro h1 span{display:inline-block;animation:drop .9s cubic-bezier(.2,1.5,.4,1) both}
#intro h1 span:nth-child(2){animation-delay:.08s}#intro h1 span:nth-child(3){animation-delay:.16s}#intro h1 span:nth-child(4){animation-delay:.24s}
#intro p{margin:18px 0 22px;color:var(--muted);font-size:15px}
#intro .load{width:220px;height:3px;border-radius:3px;background:var(--line);margin:0 auto;overflow:hidden}
#intro .load i{display:block;height:100%;width:0;background:var(--cobalt);animation:load 1.5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes drop{from{transform:translateY(-60px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes load{to{width:100%}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.filters{width:212px}.panel{width:350px}body.panel-open .strip,body.panel-open .cam{right:calc(max(16px,env(safe-area-inset-right,0px)) + 366px)}}
@media (max-width:820px){
  .brand small{display:none}
  .tools .lbl{display:none}
  .zones{order:3;width:100%}
  .spacer{display:none}
  .brand{flex:1}
  .filters{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);width:auto;max-width:260px;padding:10px 12px;gap:10px}
  .filters:not(.open)>*:not(.fold){display:none}
  .fold{display:flex}
  .hint{display:none}
  .demo{display:none}
  .cam{bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
  .panel{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-height:58%}
  .panel.closed{transform:translateY(calc(100% + 40px))}
  body.panel-open .strip{opacity:0;pointer-events:none}
  body.panel-open .strip,body.panel-open .cam{right:max(16px,env(safe-area-inset-right,0px))}
  body.panel-open .cam,body.panel-open .filters{opacity:0;pointer-events:none}
  .card{width:180px}
  .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 128px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">

  <div id="labels"></div>

  <header class="top">
    <div class="brand glass">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 29 10.5v11L16 29 3 21.5v-11Z" fill="var(--cobalt)"/><path d="M16 3 29 10.5 16 18 3 10.5Z" fill="#fff" opacity=".35"/><path d="M11 20v-5l5-3 5 3v5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>

    <button id="home" title="Vue d'ensemble"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"/></svg></button>
  </div>

function tween(obj,to,dur=1,fn=ease.io,key){if(key)for(let i=tw.length-1;i>=0;i--)if(tw[i].key===key)tw.splice(i,1);
  tw.push({obj,from:Object.fromEntries(Object.keys(to).map(k=>[k,obj[k]])),to,dur,t0:performance.now(),fn,key})}
function stepTweens(now){for(let i=tw.length-1;i>=0;i--){const t=tw[i];const k=Math.min(1,(now-t.t0)/(t.dur*1000));const e=t.fn(k);for(const p in t.to)t.obj[p]=t.from[p]+(t.to[p]-t.from[p])*e;if(k>=1)tw.splice(i,1)}}

  $('#foldCount').textContent=vis.length+' biens';
  PROPS.forEach(p=>pinEls[p.id].classList.toggle('off',!isVisible(p.id)));
  strip.innerHTML=vis.length?vis.map(p=>`<button class="card glass${selected===p.id?' active':''}" data-id="${p.id}" style="--zc:${ZONES[p.zone].c}"><span class="tag"><i></i>${ZONES[p.zone].name} · ${p.kind}</span><b>${p.title}</b><span class="meta"><strong>${eur(p.price)}</strong><span>${p.surface} m²</span></span></button>`).join('')
    :`<div class="card glass"><b>Aucun bien dans ce budget</b><span class="meta">Élargissez le budget ou la zone.</span></div>`;
}
strip.onclick=e=>{const c=e.target.closest('[data-id]');if(c){stopTour();select(c.dataset.id)}};
strip.addEventListener('mouseover',e=>{const c=e.target.closest('[data-id]');PROPS.forEach(p=>pinEls[p.id].classList.toggle('hover',c&&c.dataset.id===p.id))});

/* panel */
let selected=null;const panel=$('#panel');
function planSVG(p){const w=100,h=Math.round(100*(p.build.t==='tower'?p.build.d/p.build.w:p.build.parts[0].d/p.build.parts[0].w));const lay=layoutRooms(p.rooms);
  return `<svg viewBox="-2 -2 ${w+4} ${h+4}" role="img" aria-label="Plan schématique"><rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="1.6"/>`+
  lay.map(r=>{const x=r.x*w,y=r.y*h,rw=r.w*w,rh=r.h*h;const fs=Math.min(5.2,rw/6);return `<rect x="${x+.8}" y="${y+.8}" width="${rw-1.6}" height="${rh-1.6}" fill="${roomColor(r.name)}" opacity=".55" stroke="currentColor" stroke-width=".5"/><text x="${x+rw/2}" y="${y+rh/2+fs/3}" font-size="${fs}" text-anchor="middle" fill="currentColor" font-family="Manrope,sans-serif" font-weight="700">${r.name}</text>`}).join('')+`</svg>`}
function dpeHTML(p){return `<div class="dpe">`+Object.entries(DPE).map(([l,c],i)=>`<div class="bar${l===p.dpe?' on':''}"><i style="width:${28+i*9}%;background:${c}">${l}</i>${l===p.dpe?`<em>${p.kwh} kWh/m²/an</em>`:''}</div>`).join('')+`</div>`}
function slotsHTML(){const days=[];const d=new Date();while(days.length<5){d.setDate(d.getDate()+1);if(d.getDay()!==0)days.push(new Date(d))}
  const f=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric'});
  return `<div class="slots">`+days.map(x=>`<div class="d">${f.format(x)}</div>`).join('')+['10:00','14:30','17:30'].map(t=>days.map(x=>`<button data-slot="${f.format(x)} à ${t}" aria-pressed="false">${t}</button>`).join('')).join('')+`</div>`}
function openPanel(p){
  const Z=ZONES[p.zone];
  panel.style.setProperty('--zc',Z.c);
  panel.innerHTML=`<div class="panel-head">
    <div class="row"><span class="tag"><i></i>${Z.name} · ${p.kind}</span><button class="x" id="closeP" aria-label="Fermer la fiche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <h2>${p.title}</h2><div class="town">${p.town}${p.etage?' · '+p.etage:''}</div>
    <div class="price"><b>${eur(p.price)}</b><span>${fmt(p.price/p.surface)} €/m²</span></div></div>
  <div class="panel-body">
    <div class="specs"><div class="spec"><b>${p.surface}</b><span>m²</span></div><div class="spec"><b>${p.pieces}</b><span>pièces</span></div><div class="spec"><b>${p.ch}</b><span>chambres</span></div><div class="spec"><b>${p.terrain?(p.terrain>=10000?(p.terrain/10000).toFixed(1).replace('.',',')+' ha':fmt(p.terrain)+' m²'):'—'}</b><span>terrain</span></div></div>
    <div class="actions">
      <button class="btn" id="xrayBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9 12 4l9 5M5 10v9h14v-9M9 19v-6h6v6"/></svg>Voir l'intérieur</button>
      <button class="btn" id="orbitBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="4"/><circle cx="12" cy="12" r="2.5"/></svg>Tourner autour</button>
      <button class="btn primary" id="visitBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Réserver une visite</button>
    </div>
    <div id="visitBox" hidden><p class="sec-t">Choisir un créneau</p>${slotsHTML()}<div id="visitOk" style="margin-top:8px"></div></div>
    <p class="desc">${p.desc}</p>
    <div class="hl">${p.hl.map(h=>`<span>${h}</span>`).join('')}</div>
    <div class="plan"><div class="cap"><span>Plan schématique</span><span>${p.surface} m² · ${p.rooms.length} espaces</span></div>${planSVG(p)}</div>
    <div><p class="sec-t">Diagnostic énergétique</p>${dpeHTML(p)}</div>
    <div class="sim"><p class="sec-t" style="margin:0">Simuler le financement</p>
      <label for="apport">Apport : <b id="apportV" style="color:var(--ink);font-family:var(--f-data)"></b><input type="range" id="apport" min="0" max="${Math.round(p.price*.5/1000)*1000}" step="1000" value="${Math.round(p.price*.15/1000)*1000}"></label>
      <div class="two"><label for="duree">Durée<select id="duree"><option value="15">15 ans</option><option value="20">20 ans</option><option value="25" selected>25 ans</option></select></label>
      <label for="taux">Taux annuel (%)<input type="number" id="taux" value="3.4" step="0.05" min="0" max="10"></label></div>
      <div class="out" id="simOut"></div>
      <p class="note">Estimation indicative hors assurance. Frais de notaire estimés à 7,5 % (ancien), inclus dans le montant emprunté.</p>
    </div>
  </div>`;
  panel.classList.remove('closed');document.body.classList.add('panel-open');
  $('#closeP').onclick=()=>deselect();
  $('#xrayBtn').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);setXray(p.id,on);if(on){tween(view,{zoom:Math.max(view.zoom,W<720?4:2.8),el:W<=820?.6:.85},1.1,ease.io,'xr');toast(p.build.t==='tower'?'Coupe à l\'étage du bien':'Toiture retirée : '+p.rooms.length+' espaces')}else tween(view,{el:.6},1,ease.io,'xr')};
  $('#orbitBtn').onclick=e=>{orbit=!orbit;e.currentTarget.setAttribute('aria-pressed',orbit)};
  $('#visitBtn').onclick=()=>{const v=$('#visitBox');v.hidden=!v.hidden;if(!v.hidden){const pb=panel.querySelector('.panel-body');pb.scrollTo({top:v.offsetTop-pb.offsetTop-10,behavior:'smooth'})}};
  $('#visitBox').onclick=e=>{const b=e.target.closest('[data-slot]');if(!b)return;$('#visitBox').querySelectorAll('[data-slot]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#visitOk').innerHTML=`<div class="confirm">Créneau retenu : ${b.dataset.slot}. Sur le site en ligne, cette demande part directement à l'agence.</div>`};
  const sim=()=>{const ap=+$('#apport').value,n=+$('#duree').value*12,r=(+$('#taux').value||0)/100/12;const notaire=p.price*.075;const P=Math.max(0,p.price+notaire-ap);
    const m=r?P*r/(1-Math.pow(1+r,-n)):P/n;$('#apportV').textContent=eur(ap);
    $('#simOut').innerHTML=`<div><span>Mensualité estimée</span><b>${eur(m)}</b></div><div><span>Montant emprunté</span><b>${short(P)}</b></div><div><span>Coût du crédit</span><b>${short(m*n-P)}</b></div>`};
  ['apport','duree','taux'].forEach(id=>$('#'+id).addEventListener('input',sim));sim();
}
let orbit=false;
function select(id){
  if(selected&&selected!==id)setXray(selected,false);
  const prev=selected;selected=id;const p=PROPS.find(q=>q.id===id);const o=propObjs[id];
  PROPS.forEach(q=>pinEls[q.id].classList.toggle('active',q.id===id));
  strip.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.id===id));
  {const cd=strip.querySelector(`[data-id="${id}"]`);if(cd)strip.scrollTo({left:cd.offsetLeft-strip.clientWidth/2+cd.offsetWidth/2,behavior:'smooth'})}
  // camera: offset so building sits left of panel on desktop
  const offPx=W>820?-190:0, upPx=W<=820?H*.2:0;const z=W<720?3.4:2.3;
  const upp=frustum/z/H;const s=Math.sin(view.az),c=Math.cos(view.az);
  const ox=-c*offPx*upp+s*upPx*upp/Math.sin(.6), oz=s*offPx*upp+c*upPx*upp/Math.sin(.6);
  flyTo(p.x+ox,p.z+oz,z,undefined,1.5,p.build.t==='tower'?p.build.floor*1.2+1:1.5);
  tween(view,{el:.6},1.2,ease.io,'xr');
  o.lift=0;tween(o,{lift:1},.9,ease.back,'lift'+id);
  o.wave.material.opacity=.9;o.wave.scale.setScalar(o.ring.userData.r*.6);tween(o.wave.scale,{x:o.ring.userData.r*3,y:o.ring.userData.r*3,z:o.ring.userData.r*3},1.4,ease.out,'w'+id);tween(o.wave.material,{opacity:0},1.4,ease.out,'wo'+id);
  if(prev&&prev!==id)tween(propObjs[prev],{lift:0},.5,ease.out,'lift'+prev);
  orbit=false;openPanel(p);hideHint();
}
function deselect(keepCam){if(!selected)return;setXray(selected,false);tween(propObjs[selected],{lift:0},.5,ease.out,'lift'+selected);selected=null;orbit=false;
  panel.classList.add('closed');document.body.classList.remove('panel-open');PROPS.forEach(q=>pinEls[q.id].classList.remove('active'));strip.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  if(!keepCam)tween(view,{zoom:Math.max(.9,view.zoom*.6),el:.6,ty:0},1,ease.io,'cam')}
function setXray(id,on){const o=propObjs[id];o.xon=on;tween(o,{xray:on?1:0},.9,ease.io,'x'+id);if(on)o.rooms.visible=true}

/* tour */
let tourI=0,tourTimer=null;
$('#tourBtn').onclick=()=>tourOn?stopTour():startTour();
function startTour(){tourOn=true;$('#tourBtn').setAttribute('aria-pressed','true');tourI=0;tourStep()}
function tourStep(){const vis=PROPS.filter(p=>isVisible(p.id));if(!vis.length||!tourOn){stopTour();return}const p=vis[tourI%vis.length];tourI++;select(p.id);orbit=true;$('#orbitBtn')?.setAttribute('aria-pressed','true');tourTimer=setTimeout(tourStep,5200)}
function stopTour(){if(!tourOn)return;tourOn=false;clearTimeout(tourTimer);$('#tourBtn').setAttribute('aria-pressed','false');orbit=false;$('#orbitBtn')?.setAttribute('aria-pressed','false')}

/* night */
const env={night:0};
function setNight(on){document.body.classList.toggle('night',on);$('#nightBtn').setAttribute('aria-pressed',on);$('#nightBtn .lbl').textContent=on?'Jour':'Nuit';tween(env,{night:on?1:0},1.8,ease.io,'night')}
$('#nightBtn').onclick=()=>setNight(!document.body.classList.contains('night'));
try{if(matchMedia('(prefers-color-scheme: dark)').matches){document.body.classList.add('night');env.night=1;$('#nightBtn').setAttribute('aria-pressed','true');$('#nightBtn .lbl').textContent='Jour'}}catch(e){}

/* toast / hint */
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
let hintGone=false;function hideHint(){if(hintGone)return;hintGone=true;$('#hint').style.opacity=0}

/* ================= loop ================= */
const v3=new THREE.Vector3();const cA=new THREE.Color(),cB=new THREE.Color();
const start=performance.now();let last=start;
const SUN_D=new THREE.Color('#FFF3E0'),SUN_N=new THREE.Color('#8FA2FF'),HEMI_N=new THREE.Color('#6D7CFF'),HEMI_D=new THREE.Color('#ffffff'),SEA_D=new THREE.Color('#5DB4DA'),SEA_N=new THREE.Color('#1E3B6E');
function place(el,x,y,z,dy=0){v3.set(x,y,z).project(camera);if(v3.z>1||v3.z<-1){el.style.visibility='hidden';return}el.style.visibility='';const sx=(v3.x+1)/2*W,sy=(1-v3.y)/2*H;el.style.transform=`translate(${sx}px,${sy+dy}px) translate(-50%,-100%)`}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-start)/1000;
  stepTweens(now);
  if(orbit&&selected)view.az+=dt*.35;
  updateCam();
  // rise
  risers.forEach(r=>{if(r.done)return;const k=Math.max(0,Math.min(1,(t-r.d)/.9));r.o.scale.y=Math.max(.001,ease.elastic(k));if(k>=1){r.o.scale.y=1;r.done=true}});
  // props
  PROPS.forEach(p=>{const o=propObjs[p.id];const hv=hovered===p.id?1:0;o.hover+=(hv-o.hover)*.15;
    o.grp.position.y=o.lift*.8+o.hover*.35+(selected===p.id?Math.sin(t*2)*.12:0);
    const sel=selected===p.id;o.ring.material.opacity+=((sel?.85:hv*.5)-o.ring.material.opacity)*.12;
    o.ring.scale.setScalar(o.ring.userData.r*(1+Math.sin(t*3)*.04));
    const x=o.xray;o.roofs.forEach(r=>{r.position.y=(r.userData.y0??(r.userData.y0=r.position.y))+x*9;r.rotation.z=x*.35});
    o.mats.forEach(m=>{m.opacity=1-x*.86;m.depthWrite=x<.5});o.decor.forEach(d=>d.visible=x<.3);
    if(o.rooms.visible){o.rooms.scale.y=Math.max(.01,x);if(x<.01&&!o.xon)o.rooms.visible=false}
  });
  // cars
  cars.forEach(c=>{const {a,b}=c.path;const len=Math.hypot(b[0]-a[0],b[1]-a[1]);c.t=(c.t+c.speed*dt/len)%1;const x=a[0]+(b[0]-a[0])*c.t,z=a[1]+(b[1]-a[1])*c.t;c.g.position.set(x,0,z);c.g.rotation.y=Math.atan2(-(b[1]-a[1]),b[0]-a[0])});
  clouds.forEach(c=>{c.g.position.x+=c.v*dt;if(c.g.position.x>100)c.g.position.x=-100});
  // sea
  const pos=seaGeo.attributes.position;for(let i=0;i<pos.count;i++){const bx=seaBase[i*3],bz=seaBase[i*3+2];pos.array[i*3+1]=Math.sin(bx*.7+t*1.6)*.12+Math.cos(bz*.5+t*1.1)*.12}pos.needsUpdate=true;seaGeo.computeVertexNormals();
  boats.forEach((b,i)=>{b.position.y=-.15+Math.sin(t*1.5+i)*.1;b.rotation.x=Math.sin(t*1.2+i)*.06});
  beamPivot.rotation.y=t*.9;
  // night
  const n=env.night;
  scene.background.copy(BG_DAY).lerp(BG_NIGHT,n);scene.fog.color.copy(scene.background);
  hemi.intensity=.78-n*.5;hemi.color.copy(HEMI_D).lerp(HEMI_N,n);sun.intensity=1.05-n*.78;sun.color.copy(SUN_D).lerp(SUN_N,n);
  seaMat.color.copy(SEA_D).lerp(SEA_N,n);cloudM.opacity=.92-n*.55;beam.material.opacity=n*.22;
  nightMats.forEach(([m,k])=>m.emissiveIntensity=n*k);
  renderer.toneMappingExposure=1;
  // labels
  PROPS.forEach(p=>{const o=propObjs[p.id];place(pinEls[p.id],p.x,o.top+o.grp.position.y+o.xray*6,p.z)});
  Object.entries(ZONES).forEach(([k,z])=>{place(zEls[k],z.x,0,40,0);zEls[k].style.opacity=state.zone==='all'||state.zone===k?(view.zoom>2.2?0:.24):.08});
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
refresh();
requestAnimationFrame(frame);
// intro
const intro=$('#intro');const goIntro=()=>{intro.classList.add('gone');
  view.zoom=.45;view.az=Math.PI/4-1.1;view.el=1.1;view.tx=-2;tween(view,{zoom:W<720?.95:.72,az:Math.PI/4,el:.6},2.6,ease.io,'cam')};
let introDone=false;const endIntro=()=>{if(introDone)return;introDone=true;goIntro()};
intro.onclick=endIntro;setTimeout(endIntro,1650);
view.tx=-2;view.zoom=.45;view.az=Math.PI/4-1.1;view.el=1.1;
})();
</script>

</body></html>
